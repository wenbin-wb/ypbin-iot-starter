name: CodeQL

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read
  security-events: write
  # CodeQL 在分析后会去读 workflow run 信息（遥测）；**仓库转私有后**默认 token
  # 不再具备该权限，会以「Resource not accessible by integration」+「configuration error」失败
  # （实测：公开时绿、转私有后红）。显式声明 actions: read 即可。
  actions: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 配置 JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 初始化 CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          queries: security-and-quality
          config-file: ./.github/codeql/codeql-config.yml

      - name: 构建（CodeQL 需要真实编译产物）
        run: mvn -B -ntp clean compile -DskipTests

      - name: 执行分析
        uses: github/codeql-action/analyze@v4
