name: CodeQL

# ⚠️ 目前**只支持手动触发**。
#
# 原因：GitHub 的 code scanning（CodeQL 结果上传）对**公开仓库免费**，
# 对**私有仓库需要 GitHub Advanced Security**（付费）。本仓当前是私有的，
# 每次 push 都会以「Code scanning is not enabled for this repository」失败 ——
# 一个永远红的检查只会训练人忽略红灯，所以这里不挂在 push/PR 上。
#
# 恢复方式（二选一）：
#   ① 仓库转公开 → 取消下面的注释，恢复 push/pull_request/schedule 触发；
#   ② 开通 GitHub Advanced Security → 同样取消注释。
#
# 注：本地/CI 的静态质量已由其他门禁覆盖（ArchUnit 架构约束、源码规范扫描、
# NullAway 空值语义、JaCoCo 覆盖率、spotless），CodeQL 是补充而非唯一防线。
on:
  workflow_dispatch:
  # push:
  #   branches: [master, main]
  # pull_request:
  #   branches: [master, main]
  # schedule:
  #   - cron: '0 3 * * 1'

permissions:
  contents: read
  security-events: write
  # CodeQL 在分析后会去读 workflow run 信息（遥测）；**仓库转私有后**默认 token
  # 不再具备该权限，会以「Resource not accessible by integration」+「configuration error」失败
  # （实测：公开时绿、转私有后红）。显式声明 actions: read 即可。
  actions: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 配置 JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 初始化 CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          queries: security-and-quality
          config-file: ./.github/codeql/codeql-config.yml

      - name: 构建（CodeQL 需要真实编译产物）
        run: mvn -B -ntp clean compile -DskipTests

      - name: 执行分析
        uses: github/codeql-action/analyze@v4
