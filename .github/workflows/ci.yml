name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# ⚠️ 前置：本仓父 pom 是未发布的 SNAPSHOT，CI 需要先能获取它（见 README「构建前置」）。
# 在补齐该前置之前，本工作流会卡在父 POM 解析 —— 它目前**从未成功执行过**。

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 配置 JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 不带任何 -P：dev-only 是 activeByDefault profile，显式激活任一 profile 都会让它失效，
      # 架构约束门禁（含 ModulePublishingTest）就不会跑。这是本步骤唯一正确的调用方式。
      - name: 全量构建与单元测试（含架构约束与覆盖率门禁）
        run: mvn -B -ntp clean test

      # 自带「门禁是否真的执行过」自检：出现 Nothing to compile 或某模块没有编译记录即失败。
      - name: 空值语义门禁（NullAway）
        run: tools/check-nullaway.sh

      - name: 依赖版本收敛
        run: mvn -B -ntp -Pdep-convergence validate

      - name: 校验配置元数据未漂移
        run: node tools/export-config-metadata.mjs --check

      - name: 生成 CycloneDX SBOM（软件物料清单）
        run: mvn -B -ntp -Psbom verify -DskipTests

      - name: 归档 SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: '**/target/bom.json'
          if-no-files-found: warn

      - name: 归档 JaCoCo 覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-reports
          path: '**/target/site/jacoco/'
          if-no-files-found: warn
