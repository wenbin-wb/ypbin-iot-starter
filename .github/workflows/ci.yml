name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 配置 JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 不带任何 -P：dev-only 是 activeByDefault profile，显式激活任一 profile 都会让它失效，
      # 架构约束门禁（含 ModulePublishingTest）就不会跑。这是本步骤唯一正确的调用方式。
      - name: 全量构建与单元测试（含架构约束与覆盖率门禁）
        run: mvn -B -ntp clean test

      # 自带「门禁是否真的执行过」自检：出现 Nothing to compile 或某模块没有编译记录即失败。
      - name: 空值语义门禁（NullAway）
        run: tools/check-nullaway.sh

      - name: 依赖版本收敛
        run: mvn -B -ntp -Pdep-convergence validate

      - name: 校验配置元数据未漂移
        run: node tools/export-config-metadata.mjs --check

      - name: 生成 CycloneDX SBOM（软件物料清单）
        run: mvn -B -ntp -Psbom verify -DskipTests

      - name: 归档 SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: '**/target/bom.json'
          if-no-files-found: warn

      - name: 归档 JaCoCo 覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-reports
          path: '**/target/site/jacoco/'
          if-no-files-found: warn

  # 集成测试独立作业：与 build 作业用**同一个 -Pit** 跑，避免与单元测试重复。
  # -Dsurefire.skip=true 只跳过 surefire（单元测试），failsafe(*IT.java) 照跑。
  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 配置 JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # -Pit 会让 activeByDefault 的 dev-only 失效，因此根 pom 的 it profile 里显式带回了
      # architecture-tests 与 integration-tests 两个模块 —— 否则反应堆里没有 IT 模块，
      # 命令会"成功"但一个 IT 都没跑（门禁空转）。
      - name: 集成测试（*IT.java，嵌入式 broker/服务端）
        run: mvn -B -ntp -Pit -Dsurefire.skip=true verify

      - name: 归档 Failsafe 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failsafe-reports
          path: '**/target/failsafe-reports/'
          if-no-files-found: warn
